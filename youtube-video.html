<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Video Page</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 30px 16px; text-align: center; color: #222; }
    main { max-width: 850px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
    .video { position: relative; width: 100%; aspect-ratio: 16 / 9; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; border-radius: 8px; }
    a { color: #0759c7; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>YouTube Video Embedded in HTML</h1>
    <p>The video below is embedded using the YouTube <code>&lt;iframe&gt;</code> element.</p>
    <div class="video">
      <iframe src="https://www.youtube-nocookie.com/embed/M7lc1UVf-VE" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <p><a href="index.html">← Back to Practice Set</a></p>
  </main>
</body>
</html>
