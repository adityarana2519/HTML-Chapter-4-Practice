<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Video Page</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7fb; margin: 0; padding: 30px 16px; text-align: center; color: #222; }
    main { max-width: 800px; margin: auto; background: white; padding: 24px; border-radius: 12px; }
    video { width: 100%; max-width: 700px; border-radius: 8px; background: #111; }
    a { color: #0759c7; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>HTML Video Example</h1>
    <p>This video is embedded using the HTML <code>&lt;video&gt;</code> tag.</p>
    <video controls width="700">
      <source src="myvideo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <p><a href="index.html">← Back to Practice Set</a></p>
  </main>
</body>
</html>
