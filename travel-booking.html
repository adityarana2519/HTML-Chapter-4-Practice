<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking Form</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #eaf4ff; margin: 0; padding: 28px 16px; color: #222; }
    form { max-width: 650px; margin: auto; background: white; padding: 26px; border-radius: 12px; box-shadow: 0 5px 18px #00000012; }
    h1 { text-align: center; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 11px; border: 1px solid #b8c4d3; border-radius: 6px; font: inherit; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    button { margin-top: 20px; padding: 12px 20px; width: 100%; background: #0759c7; color: white; border: 0; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #06479e; }
    .back { text-align: center; margin-top: 18px; }
    a { color: #0759c7; text-decoration: none; }
    @media (max-width: 520px) { .row { grid-template-columns: 1fr; gap: 0; } }
  </style>
</head>
<body>
  <form action="#" method="get" onsubmit="alert('Demo form submitted! No actual booking has been made.'); return false;">
    <h1>Book Your Vacation</h1>
    <p>Fill in your details to plan your next trip.</p>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
    <label for="destination">Choose Destination</label>
    <select id="destination" name="destination" required>
      <option value="">-- Select a destination --</option>
      <option>Goa</option>
      <option>Manali</option>
      <option>Jaipur</option>
      <option>Kerala</option>
      <option>Agra</option>
    </select>
    <div class="row">
      <div>
        <label for="departure">Departure Date</label>
        <input type="date" id="departure" name="departure" required>
      </div>
      <div>
        <label for="return">Return Date</label>
        <input type="date" id="return" name="return" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" name="guests" min="1" max="20" value="1" required>
      </div>
      <div>
        <label for="travel">Travel Type</label>
        <select id="travel" name="travel">
          <option>Family</option>
          <option>Adventure</option>
          <option>Honeymoon</option>
          <option>Solo</option>
        </select>
      </div>
    </div>
    <label for="requests">Special Requests</label>
    <textarea id="requests" name="requests" rows="3" placeholder="Any special requirements?"></textarea>
    <button type="submit">Submit Booking Request</button>
    <p class="back"><a href="index.html">← Back to Practice Set</a></p>
  </form>
</body>
</html>
