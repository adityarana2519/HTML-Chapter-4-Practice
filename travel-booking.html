<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Booking Form</title>
</head>
<body>
  <form action="#" method="get" onsubmit="alert('Demo form submitted! No actual booking has been made.'); return false;">
    <h1>Book Your Vacation</h1>
    <p>Fill in your details to plan your next trip.</p>
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="you@example.com" required>
    <label for="destination">Choose Destination</label>
    <select id="destination" name="destination" required>
      <option value="">-- Select a destination --</option>
      <option>Goa</option>
      <option>Manali</option>
      <option>Jaipur</option>
      <option>Kerala</option>
      <option>Agra</option>
    </select>
    <div class="row">
      <div>
        <label for="departure">Departure Date</label>
        <input type="date" id="departure" name="departure" required>
      </div>
      <div>
        <label for="return">Return Date</label>
        <input type="date" id="return" name="return" required>
      </div>
    </div>
    <div class="row">
      <div>
        <label for="guests">Number of Guests</label>
        <input type="number" id="guests" name="guests" min="1" max="20" value="1" required>
      </div>
      <div>
        <label for="travel">Travel Type</label>
        <select id="travel" name="travel">
          <option>Family</option>
          <option>Adventure</option>
          <option>Honeymoon</option>
          <option>Solo</option>
        </select>
      </div>
    </div>
    <label for="requests">Special Requests</label>
    <textarea id="requests" name="requests" rows="3" placeholder="Any special requirements?"></textarea>
    <button type="submit">Submit Booking Request</button>
    <p class="back"><a href="index.html">← Back to Practice Set</a></p>
  </form>
</body>
</html>
